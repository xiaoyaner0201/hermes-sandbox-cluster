name: Plugin CI
on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check unmodified SDK hashes and version
        run: python tests/vendored_core.py
      - name: Check Python and shell syntax
        run: |
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if name.endswith('.py'):
                  ast.parse(Path(name).read_bytes(), filename=name)
          PY
          bash -n scripts/vendor-core.sh
          git diff --check
      - name: Verify public immutable SDK source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.request import urlopen
          root = Path('plugin/agent_sandbox_backend/_vendor')
          commit = re.search(r'^- source commit: ([0-9a-f]{40})$', (root / 'VENDORED.md').read_text(), re.M).group(1)
          for name in ('core.py', '__init__.py'):
              url = f'https://raw.githubusercontent.com/xiaoyaner0201/self-hosted-agent-sandbox/{commit}/src/self_hosted_agent_sandbox/{name}'
              assert (root / 'agent_sandbox' / name).read_bytes() == urlopen(url, timeout=60).read(), name
          PY
# This workflow validates source integrity only. Live-cluster acceptance remains separate.
# There is deliberately no package-registry publishing job, including on RC tags.
